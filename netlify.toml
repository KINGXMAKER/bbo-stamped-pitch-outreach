[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Netlify caps SYNCHRONOUS function execution at 10s on Free/Starter; this timeout is only
# honored on plans that support a higher ceiling. The real fix lives in generate-pitch.js, which
# budgets itself via LLM_TOTAL_BUDGET_MS (default 9000 — finishes under the 10s cap). If this site
# is on a plan that honors 26s, set LLM_TOTAL_BUDGET_MS=24000 to allow a richer single pass.
[functions."generate-pitch"]
  timeout = 26

# Restores circuit-broken AI models only after successful probes; probes disabled models for telemetry.
[functions."ai-health-probe"]
  schedule = "*/5 * * * *"

[[redirects]]
  from = "/api/analyze-screenshot"
  to = "/.netlify/functions/analyze-screenshot"
  status = 200

