[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Best-effort only — Netlify caps sync function execution at 10s unless the plan supports a
# higher ceiling, in which case this raises it to reduce timeouts on heavy prompts. The actual
# fix is generate-pitch.js budgeting itself well under 10s; this is a safety margin, not the fix.
[functions."generate-pitch"]
  timeout = 26

[[redirects]]
  from = "/api/analyze-screenshot"
  to = "/.netlify/functions/analyze-screenshot"
  status = 200

[[redirects]]
  from = "/api/generate-pitch"
  to = "/.netlify/functions/generate-pitch"
  status = 200

[[redirects]]
  from = "/api/scrape-ig"
  to = "/.netlify/functions/scrape-ig"
  status = 200

[[redirects]]
  from = "/api/send-email"
  to = "/.netlify/functions/send-email"
  status = 200

[[redirects]]
  from = "/api/save-to-sheets"
  to = "/.netlify/functions/save-to-sheets"
  status = 200

[[redirects]]
  from = "/api/save-examples"
  to = "/.netlify/functions/save-examples"
  status = 200

[[redirects]]
  from = "/api/refresh-voice"
  to = "/.netlify/functions/refresh-voice"
  status = 200

[[redirects]]
  from = "/api/get-voice-profile"
  to = "/.netlify/functions/get-voice-profile"
  status = 200

[[redirects]]
  from = "/api/update-outcome"
  to = "/.netlify/functions/update-outcome"
  status = 200

[[redirects]]
  from = "/api/update-pitch-sent"
  to = "/.netlify/functions/update-pitch-sent"
  status = 200

[[redirects]]
  from = "/api/list-models"
  to = "/.netlify/functions/list-models"
  status = 200

